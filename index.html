<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0a0f">
<meta name="description" content="MeetingMeter — Real-time meeting cost calculator. Track what your meetings actually cost with live per-attendee cost tracking, shareable summaries, and meeting history.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self';">
<link rel="manifest" href="./manifest.json">
<title>MeetingMeter — Real-Time Meeting Cost Clock</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#141420;--accent:#ff4757;--green:#2ed573;--gold:#ffa502;
  --text:#f0f0f0;--dim:#707080;--radius:16px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100dvh;display:flex;justify-content:center;align-items:center;overflow-x:hidden}
.app{width:100%;max-width:440px;min-height:100dvh;position:relative}
.screen{display:none;flex-direction:column;align-items:center;padding:24px 20px;min-height:100dvh}
.screen.active{display:flex}

/* Header */
.header{text-align:center;margin:8px 0 24px}
.header h1{font-size:1.6rem;font-weight:800;background:linear-gradient(135deg,var(--accent),#ff6b81);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{color:var(--dim);font-size:0.85rem;margin-top:4px}

/* Setup */
.attendees{width:100%;max-width:380px}
.attendee-row{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:8px;
  background:var(--card);border-radius:var(--radius);animation:slideIn 0.3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.attendee-avatar{font-size:1.8rem;min-width:40px;text-align:center}
.attendee-info{flex:1}
.attendee-name{font-weight:600;font-size:0.9rem}
.attendee-rate{font-size:0.75rem;color:var(--dim)}
.attendee-rate input{background:var(--bg);border:1px solid #333;color:var(--text);padding:4px 8px;
  border-radius:8px;width:80px;font-size:0.8rem;margin-left:4px}
.attendee-rate input:focus{outline:none;border-color:var(--accent)}
.btn-remove{background:none;border:none;color:var(--accent);font-size:1.2rem;cursor:pointer;padding:4px}

.btn{background:var(--accent);color:#fff;border:none;padding:12px 24px;border-radius:50px;
  font-size:0.9rem;font-weight:700;cursor:pointer;width:100%;max-width:380px;transition:transform 0.15s}
.btn:active{transform:scale(0.96)}
.btn-secondary{background:var(--card);color:var(--text)}
.btn-small{padding:8px 16px;font-size:0.8rem;width:auto}
.btn-inline{background:none;border:none;color:var(--gold);text-decoration:underline;cursor:pointer;
  font-size:0.8rem;padding:0;font-family:inherit}

.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;justify-content:center}
.preset-chip{background:var(--card);border:2px solid transparent;color:var(--text);
  padding:8px 14px;border-radius:50px;font-size:0.8rem;cursor:pointer;font-weight:600;
  transition:all 0.15s}
.preset-chip:active{transform:scale(0.95)}
.preset-chip:hover{border-color:var(--accent)}

/* Timer Screen */
.timer-hero{text-align:center;margin:20px 0}
.cost-display{font-size:4rem;font-weight:900;font-family:'SF Mono','Fira Code',monospace;
  color:var(--accent);line-height:1;transition:color 0.5s}
.cost-display.warning{color:var(--gold)}
.cost-display.danger{color:var(--accent);animation:pulse-cost 1s infinite}
@keyframes pulse-cost{0%,100%{opacity:1}50%{opacity:0.7}}
.cost-label{color:var(--dim);font-size:0.85rem;margin-top:4px}
.per-minute{color:var(--dim);font-size:0.8rem;margin-top:8px}
.timer-elapsed{font-size:1.2rem;font-weight:600;margin-top:4px;color:var(--text)}

.attendee-list{width:100%;max-width:380px;margin:16px 0}
.attendee-mini{display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;background:var(--card);border-radius:10px;margin-bottom:6px;font-size:0.85rem}
.attendee-mini .cost{color:var(--accent);font-weight:600;font-family:'SF Mono',monospace}

.btn-stop{background:var(--accent);color:#fff;border:none;padding:16px 48px;border-radius:50px;
  font-size:1.2rem;font-weight:800;cursor:pointer;margin:20px 0;letter-spacing:1px;
  box-shadow:0 0 30px rgba(255,71,87,0.3);animation:breathe 2s infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 20px rgba(255,71,87,0.3)}50%{box-shadow:0 0 40px rgba(255,71,87,0.6)}}
.btn-stop:active{transform:scale(0.95)}

/* Results */
.result-card{background:var(--card);border-radius:var(--radius);padding:24px;width:100%;
  max-width:380px;text-align:center;position:relative;overflow:hidden}
.result-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent))}
.result-total{font-size:3rem;font-weight:900;color:var(--accent);margin:12px 0}
.result-meta{color:var(--dim);font-size:0.85rem;margin-bottom:16px}
.result-emoji{font-size:1.5rem;margin:8px 0}
.result-breakdown{text-align:left;margin:16px 0}
.result-breakdown .attendee-mini{background:var(--bg)}

.share-text{background:var(--bg);border:1px solid #333;border-radius:12px;padding:16px;
  font-size:0.9rem;color:var(--text);margin:16px 0;white-space:pre-wrap;text-align:left;
  line-height:1.6;font-family:'SF Mono',monospace;max-height:200px;overflow-y:auto}

.btn-copy{animation:pulse-btn 2s infinite}
@keyframes pulse-btn{0%,100%{opacity:1}50%{opacity:0.85}}

/* History */
.history-list{width:100%;max-width:380px}
.history-item{background:var(--card);border-radius:var(--radius);padding:14px;
  margin-bottom:8px;cursor:pointer}
.history-item:hover{background:#1a1a2a}
.history-item:focus{outline:2px solid var(--accent);outline-offset:2px}
.history-item .date{color:var(--dim);font-size:0.75rem}
.history-item .cost{color:var(--accent);font-weight:700;font-size:1.2rem}
.history-item .detail{color:var(--dim);font-size:0.8rem;margin-top:4px}

/* Error */
.error-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;
  align-items:center;justify-content:center;z-index:9999}
.error-dialog{background:var(--card);border-radius:24px;padding:32px;text-align:center;max-width:320px}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);
  color:var(--text);padding:10px 24px;border-radius:50px;font-size:0.85rem;
  z-index:999;animation:toastIn 0.3s ease,toastOut 0.3s ease 2s forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

.pro-badge{position:absolute;top:8px;right:8px;background:var(--gold);color:#000;
  font-size:0.65rem;font-weight:800;padding:3px 8px;border-radius:50px}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ═══════════════════════════════════════════
//  MEETING METER — Real-Time Cost Clock
// ═══════════════════════════════════════════

// Service Worker registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function(){});
}

// Error boundary
window.addEventListener('error',function(){
  document.getElementById('app').innerHTML='<div class="error-overlay"><div class="error-dialog">\n    <h2>⚠️ Oops!</h2><p>Something went wrong.</p>\n    <button class="btn btn-small" data-action="reload" style="margin-top:16px">🔄 Reload</button></div></div>';
});

// Preset roles
var ROLES=[
  {emoji:'👔',name:'CEO / VP',rate:200},
  {emoji:'💻',name:'Engineer / Dev',rate:100},
  {emoji:'🎨',name:'Designer',rate:85},
  {emoji:'📊',name:'PM / Manager',rate:110},
  {emoji:'💰',name:'Sales',rate:95},
  {emoji:'📝',name:'Intern / Jr',rate:35},
];

// State
var S={screen:'setup',attendees:[],startTime:null,elapsed:0,totalCost:0,
  isPro:load('pro',false),history:load('history',[]),ticker:null};

function load(k,d){try{return JSON.parse(localStorage.getItem('mm_'+k))}catch(e){return d}}

function save(k,v){
  try {
    localStorage.setItem('mm_'+k,JSON.stringify(v));
  } catch(e) {
    if (e.name==='QuotaExceededError' || (e instanceof DOMException && (e.code===22 || e.code===1014))) {
      toast('⚠️ Storage full. Please clear some history.');
    }
  }
}

function toast(m){
  var t=document.querySelector('.toast');
  if(t)t.remove();
  t=document.createElement('div');
  t.className='toast';
  t.setAttribute('role','status');
  t.setAttribute('aria-live','polite');
  t.textContent=m;
  document.body.appendChild(t);
  setTimeout(function(){t.remove()},2500);
}

// Render
function render(){
  var el=document.getElementById('app');
  if(S.screen==='setup') el.innerHTML=renderSetup();
  else if(S.screen==='timer') el.innerHTML=renderTimer();
  else if(S.screen==='results') el.innerHTML=renderResults();
  else if(S.screen==='history') el.innerHTML=renderHistory();
}

// ── Setup ───────────────────────────────
function renderSetup(){
  var attHTML='';
  S.attendees.forEach(function(a,i){
    attHTML+='<div class="attendee-row">\n      <div class="attendee-avatar">'+a.emoji+'</div>\n      <div class="attendee-info">\n        <div class="attendee-name">'+a.name+'</div>\n        <div class="attendee-rate">$<input type="number" value="'+a.rate+'" min="1" max="5000"\n          data-action="update-rate" data-index="'+i+'" onfocus="this.select()" aria-label="'+a.name+'&apos;s hourly rate">/hr</div>\n      </div>\n      <button class="btn-remove" data-action="remove-attendee" data-index="'+i+'" aria-label="Remove '+a.name+'">✕</button></div>';
  });

  var maxAtt=S.isPro?20:5;
  var canAdd=S.attendees.length<maxAtt;
  var proGate=!S.isPro&&S.attendees.length>=5;

  return '<div class="screen active">\n    <div class="header"><h1>⏱️ MeetingMeter</h1><p>What&apos;s this meeting actually costing?</p></div>\n    '+(S.isPro?'<div class="pro-badge" aria-label="Pro member">PRO</div>':'')+'\n    <div class="presets">\n      '+ROLES.map(function(r){return '<button class="preset-chip" role="button" data-action="add-attendee" data-emoji="'+r.emoji+'" data-name="'+r.name+'" data-rate="'+r.rate+'" aria-label="Add '+r.name+' at $'+r.rate+'/hr">'+r.emoji+' '+r.name+' $'+r.rate+'/hr</button>';}).join('')+'\n      <button class="preset-chip" style="border-style:dashed" role="button" data-action="add-attendee" data-emoji="👤" data-name="Custom" data-rate="50" aria-label="Add Custom at $50/hr">+ Custom</button>\n    </div>\n    <div class="attendees" style="margin-bottom:12px">'+(attHTML||'<p style="color:var(--dim);text-align:center;padding:20px">Add attendees to get started ⬆</p>')+'</div>\n    '+(proGate?'<p style="color:var(--gold);font-size:0.8rem;text-align:center;margin-bottom:8px">🔒 Free: 5 max. <button class="btn-inline" data-action="go-pro">Go Pro for unlimited</button></p>':'')+'\n    <div style="display:flex;gap:8px;width:100%;max-width:380px">\n      '+(canAdd?'<button class="btn btn-secondary btn-small" data-action="add-attendee" data-emoji="👤" data-name="Custom" data-rate="50">+ Add Person</button>':'')+'\n    </div>\n    <button class="btn" data-action="start-meeting" id="btn-start" style="margin-top:16px" '+(S.attendees.length===0?'disabled':'')+' aria-label="Start meeting with '+S.attendees.length+' attendees">▶ Start Meeting</button>\n    '+(S.history.length>0?'<button class="btn btn-secondary" data-action="nav-history" style="margin-top:8px">📋 History ('+S.history.length+')</button>':'')+'\n    '+(!S.isPro?'<button class="btn btn-secondary" data-action="go-pro" style="margin-top:8px">⭐ Go Pro — $1.99</button>':'')+'\n  </div>';
}

function addAttendee(emoji,name,rate){
  if(!S.isPro && S.attendees.length>=5){toast('Pro required for 6+ attendees');return}
  S.attendees.push({emoji:emoji,name:name,rate:parseInt(rate)||50});
  render();
}
function removeAttendee(i){S.attendees.splice(i,1);render()}
function updateRate(i,v){S.attendees[i].rate=Math.max(1,Math.min(5000,parseInt(v)||0));render()}

function goPro(){
  // Simulated purchase — in prod this hits GPay/IAP
  S.isPro=true;save('pro',true);
  toast('🎉 You\'re now Pro! Unlimited attendees unlocked.');
  render();
}

// ── Timer ────────────────────────────────
function startMeeting(){
  S.startTime=Date.now();S.screen='timer';
  updateTimer();
  S.ticker=setInterval(updateTimer,200);
  render();
}

function updateTimer(){
  S.elapsed=(Date.now()-S.startTime)/1000;
  var totalRate=S.attendees.reduce(function(s,a){return s+a.rate},0);
  S.totalCost=(totalRate/3600)*S.elapsed;
  S.perMinute=totalRate/60;
  if(S.screen==='timer'){
    var cd=document.getElementById('cost-display');
    var el=document.getElementById('timer-elapsed');
    if(cd) cd.textContent='$'+S.totalCost.toFixed(2);
    if(el) el.textContent=formatTime(S.elapsed);
    // Update per-attendee costs
    S.attendees.forEach(function(a,i){
      var ac=document.getElementById('ac-'+i);
      if(ac) ac.textContent='$'+((a.rate/3600)*S.elapsed).toFixed(2);
    });
    // Danger zone animation
    if(cd&&S.totalCost>500) cd.className='cost-display danger';
    else if(cd&&S.totalCost>200) cd.className='cost-display warning';
  }
}

function stopMeeting(){
  clearInterval(S.ticker);S.ticker=null;S.screen='results';
  var entry={date:new Date().toISOString(),attendees:S.attendees.slice(),
    elapsed:S.elapsed,totalCost:S.totalCost,perMinute:S.perMinute};
  S.history.unshift(entry);if(S.history.length>20) S.history.pop();
  save('history',S.history);
  render();
}

function formatTime(s){
  var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60);
  return (h>0?h+'h ':'')+m+'m '+sec+'s';
}

function renderTimer(){
  var totalRate=S.attendees.reduce(function(s,a){return s+a.rate},0);
  return '<div class="screen active">\n    <div class="header"><h1>⏱️ Meeting In Progress</h1></div>\n    <div class="timer-hero">\n      <div class="cost-display" id="cost-display" role="timer" aria-live="polite" aria-label="Current meeting cost">$0.00</div>\n      <div class="cost-label">total cost · $'+totalRate+'/hr for '+S.attendees.length+' people</div>\n      <div class="timer-elapsed" id="timer-elapsed">0s</div>\n      <div class="per-minute">$'+S.perMinute.toFixed(2)+' / minute</div>\n    </div>\n    <div class="attendee-list" role="list">\n      '+S.attendees.map(function(a,i){return '<div class="attendee-mini" role="listitem">\n        <span>'+a.emoji+' '+a.name+' · $'+a.rate+'/hr</span>\n        <span class="cost" id="ac-'+i+'">$0.00</span></div>';}).join('')+'\n    </div>\n    <button class="btn-stop" data-action="stop-meeting" aria-label="Stop meeting and show results">⏹ STOP MEETING</button>\n    <button class="btn btn-secondary" data-action="cancel-meeting" style="margin-top:8px">↩ Back</button>\n  </div>';
}

function cancelMeeting(){
  clearInterval(S.ticker);S.ticker=null;
  S.screen='setup';render();
}

// ── Results ──────────────────────────────
function renderResults(){
  var t=S.totalCost,el=S.elapsed,pm=S.perMinute;
  var emoji=t>1000?'🫠 '+(t>500?'😱 ':'💸 '):'🤔 ';
  var shareMsg='🫠 This meeting just cost $'+t.toFixed(2)+'\n\n⏱ '+formatTime(el)+' · $'+pm.toFixed(2)+'/min · '+S.attendees.length+' people\n\n'+S.attendees.map(function(a){return a.emoji+' '+a.name+': $'+((a.rate/3600)*el).toFixed(2);}).join('\n')+'\n\nMade with MeetingMeter ⏱️';

  return '<div class="screen active">\n    <div class="results-emoji">'+emoji+'</div>\n    <div class="result-card">\n      <div class="result-total">$'+t.toFixed(2)+'</div>\n      <div class="result-meta">'+formatTime(el)+' · $'+pm.toFixed(2)+'/min · '+S.attendees.length+' people</div>\n      <div class="result-breakdown">\n        '+S.attendees.map(function(a){return '<div class="attendee-mini">\n          <span>'+a.emoji+' '+a.name+' · $'+a.rate+'/hr</span>\n          <span class="cost">$'+((a.rate/3600)*el).toFixed(2)+'</span></div>';}).join('')+'\n      </div>\n    </div>\n    <div class="share-text" id="share-text" role="textbox" aria-readonly="true" aria-label="Shareable meeting summary">'+shareMsg+'</div>\n    <button class="btn btn-copy" data-action="copy-share" style="max-width:380px">📋 Copy & Share</button>\n    <button class="btn btn-secondary" data-action="new-meeting" style="max-width:380px;margin-top:8px">🔄 New Meeting</button>\n    <button class="btn btn-secondary" data-action="nav-history" style="max-width:380px;margin-top:4px">📋 History</button>\n  </div>';
}

function copyShare(){
  var text=document.getElementById('share-text').textContent;
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(function(){toast('📋 Copied! Share on Slack/Twitter')}).catch(function(){toast('Failed to copy')});}
  else{toast('Failed to copy');}
}

// ── History ──────────────────────────────
function renderHistory(){
  return '<div class="screen active">\n    <div class="header"><h1>📋 Meeting History</h1></div>\n    <div class="history-list">\n      '+(S.history.length===0?'<p style="color:var(--dim);text-align:center;padding:40px">No meetings yet</p>':'')+'\n      '+S.history.map(function(h,i){return '<div class="history-item" data-action="replay-history" data-index="'+i+'" role="button" tabindex="0" aria-label="Replay meeting from '+new Date(h.date).toLocaleDateString()+'">\n        <div class="date">'+new Date(h.date).toLocaleDateString()+' · '+new Date(h.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</div>\n        <div class="cost">$'+h.totalCost.toFixed(2)+'</div>\n        <div class="detail">'+formatTime(h.elapsed)+' · '+h.attendees.length+' people · $'+h.perMinute.toFixed(2)+'/min</div>\n      </div>';}).join('')+'\n    </div>\n    <button class="btn btn-secondary" data-action="nav-setup" style="margin-top:16px;max-width:380px">← Back to Setup</button>\n  </div>';
}

function replayHistory(i){
  var h=S.history[i];
  S.attendees=h.attendees;S.elapsed=h.elapsed;S.totalCost=h.totalCost;
  S.perMinute=h.perMinute;S.screen='results';render();
}

// ── Event Delegation ────────────────────
(function(){
  var app=document.getElementById('app');

  // Click handler for all data-action elements
  app.addEventListener('click',function(e){
    var target=e.target.closest('[data-action]');
    if(!target) return;
    var action=target.dataset.action;

    switch(action){
      case 'add-attendee':
        addAttendee(target.dataset.emoji,target.dataset.name,parseInt(target.dataset.rate)||50);
        // Focus start button after adding attendee
        setTimeout(function(){
          var btn=document.getElementById('btn-start');
          if(btn) btn.focus();
        },50);
        break;
      case 'remove-attendee':
        removeAttendee(parseInt(target.dataset.index));
        break;
      case 'start-meeting':
        if(S.attendees.length>0) startMeeting();
        break;
      case 'stop-meeting':
        stopMeeting();
        break;
      case 'cancel-meeting':
        cancelMeeting();
        break;
      case 'go-pro':
        goPro();
        break;
      case 'nav-setup':
        S.screen='setup';render();
        break;
      case 'nav-history':
        S.screen='history';render();
        break;
      case 'new-meeting':
        S.attendees=[];S.screen='setup';render();
        break;
      case 'copy-share':
        copyShare();
        break;
      case 'replay-history':
        replayHistory(parseInt(target.dataset.index));
        break;
      case 'reload':
        init();
        break;
    }
  });

  // Change handler for rate inputs
  app.addEventListener('change',function(e){
    if(e.target.dataset.action==='update-rate'){
      updateRate(parseInt(e.target.dataset.index),e.target.value);
    }
  });

  // Keyboard: Enter/Space activates non-button actionable elements
  app.addEventListener('keydown',function(e){
    if(e.key==='Enter' || e.key===' '){
      var actionable=e.target.closest('[data-action]');
      if(!actionable) return;
      // Native buttons handle Enter/Space themselves
      if(actionable.tagName==='BUTTON') return;
      // Don't intercept in text inputs
      if(e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
      e.preventDefault();
      actionable.click();
    }
  });
})();

// ── Init ─────────────────────────────────
function init(){S.screen='setup';render()}
init();
</script>
</body>
</html>
